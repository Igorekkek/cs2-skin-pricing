[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinprice"
version = "0.1.0"
description = "Price models for CS2 weapon skins and sticker crafts, trained on CSFloat sales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "catboost>=1.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
notebooks = ["matplotlib>=3.8", "jupyter>=1.0", "nbconvert>=7"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
skinprice = "skinprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skinprice = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses: safe as default arguments
extend-immutable-calls = ["skinprice.split.SplitConfig", "skinprice.features.build.FeatureConfig"]
